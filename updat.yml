user: username # required
type: contao # contao | bedrock | git
admin_password: abcdefg # required
repository: vendor/repo:branch # :branch is optional, defaults to master
domain: domain.com # optional
destination: ~/sites/username/www # optional
php_ver: 7.3 # optional
web_dir: www # optional defaults to www, take note that the real web_dir will be : "/home/$user/$web_dir"
git_username: aznoqmous # optional, to use with git_token to provide a username:app_token authentification
git_token: your token here # optional, to use with git_username to provide a username:app_token authentification
backup: # optional, those folders/files will be saved before update and re-installed after update completion
  - files
  - config/parameters.yml
  - .env.local
post_install_cmd:
  - echo "Done";
  - echo "Another command"
